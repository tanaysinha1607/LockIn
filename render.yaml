# Render Blueprint: Dashboard -> New -> Blueprint -> pick this repo.
# Secrets marked sync:false are asked for in the dashboard and never stored in git.
services:
  - type: web
    name: lockin-api
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: MONGODB_URI
        sync: false
      - key: ACCESS_TOKEN_SECRET
        generateValue: true
      - key: REFRESH_TOKEN_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: CHECKIN_REQUIRE_GPS
        value: "true"
